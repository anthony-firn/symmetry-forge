[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symforge"
version = "0.1.0"
description = "From first principles symmetry discovery engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Symmetry Forge"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.3"]
nauty = ["pynauty>=2.8.8.1"]
sat = ["python-sat"]

[project.scripts]
symforge = "symforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
